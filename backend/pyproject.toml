[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connects-backend"
version = "0.1.0"
description = "FastAPI backend for the Connects demo: Aerospike & Yugabyte connectors, Prometheus metrics, and an OpenSRE alert bridge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "prometheus-client>=0.20",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
# The Aerospike client is a C extension that is hard to build on some
# platforms (notably Windows). It is installed lazily by the connector, so
# the app runs without it and reports the connector as "degraded".
aerospike = ["aerospike>=8.1,<20"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]