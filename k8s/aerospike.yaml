apiVersion: apps/v1
kind: Deployment
metadata:
  name: aerospike
  namespace: connects-demo
  labels:
    app: aerospike
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aerospike
  template:
    metadata:
      labels:
        app: aerospike
    spec:
      containers:
        - name: aerospike
          image: aerospike/aerospike-server:7.0.0.6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: client
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aerospike
  namespace: connects-demo
spec:
  selector:
    app: aerospike
  clusterIP: None
  ports:
    - port: 3000
      targetPort: client