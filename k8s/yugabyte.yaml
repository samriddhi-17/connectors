apiVersion: apps/v1
kind: Deployment
metadata:
  name: yugabyte
  namespace: connects-demo
  labels:
    app: yugabyte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yugabyte
  template:
    metadata:
      labels:
        app: yugabyte
    spec:
      containers:
        - name: yugabyte
          image: yugabytedb/yugabyte:2.23.1.0-b220
          imagePullPolicy: IfNotPresent
          command:
            - bin/yugabyted
          args:
            - start
            - --daemon=false
            - --ui=false
          ports:
            - containerPort: 5433
              name: postgres
            - containerPort: 7000
              name: ui
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: yugabyte
  namespace: connects-demo
spec:
  selector:
    app: yugabyte
  ports:
    - port: 5433
      targetPort: postgres