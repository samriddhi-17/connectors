apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: connects-demo
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: connects-registry:5000/connects-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: VITE_API_BASE
              value: ""
            - name: VITE_GRAFANA_URL
              value: http://localhost:30090
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: connects-demo
spec:
  selector:
    app: frontend
  type: NodePort
  ports:
    - port: 8080
      targetPort: http
      nodePort: 30080