apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: connects-demo
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: connects-registry:5000/connects-grafana:local
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: connects-secrets
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: PROMETHEUS_URL
              value: http://prometheus:9090
            - name: GRAFANA_ALERT_WEBHOOK_URL
              value: http://backend:8000/api/v1/alerts
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: connects-demo
spec:
  selector:
    app: grafana
  type: NodePort
  ports:
    - port: 3000
      targetPort: http
      nodePort: 30090